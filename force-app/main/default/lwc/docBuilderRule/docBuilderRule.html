<template>
    <template for:each={rows} for:item="c">
        <div key={c.index} class="row">
            <span class="num" aria-hidden="true">{c.num}</span>
            <div class="fields">
                <template lwc:if={c.textField}>
                    <lightning-input
                        type="text"
                        variant="label-hidden"
                        label="Field"
                        placeholder="Field, e.g. Amount, Account.Industry or calc:Subtotal"
                        value={c.field}
                        data-index={c.index}
                        data-prop="field"
                        onchange={handleChange}
                    ></lightning-input>
                </template>
                <template lwc:else>
                    <lightning-combobox
                        variant="label-hidden"
                        label="Field"
                        placeholder="Choose a field"
                        options={c.fieldOptions}
                        value={c.top}
                        data-index={c.index}
                        onchange={handleField}
                    ></lightning-combobox>
                    <template lwc:if={c.isRelated}>
                        <lightning-combobox
                            variant="label-hidden"
                            label="Field of the related record"
                            placeholder={c.relPlaceholder}
                            options={c.relOptions}
                            value={c.relValue}
                            data-index={c.index}
                            onchange={handleRelField}
                        ></lightning-combobox>
                    </template>
                </template>
                <div class="pair">
                    <lightning-combobox
                        variant="label-hidden"
                        label="Operator"
                        options={ops}
                        value={c.op}
                        data-index={c.index}
                        data-prop="op"
                        onchange={handleChange}
                    ></lightning-combobox>
                    <template lwc:if={c.isList}>
                        <lightning-combobox variant="label-hidden" label="Value" placeholder="Choose a value" options={c.valueOptions} value={c.value} data-index={c.index} data-prop="value" onchange={handleChange}></lightning-combobox>
                    </template>
                    <template lwc:if={c.isBool}>
                        <lightning-combobox variant="label-hidden" label="Value" options={c.boolOptions} value={c.value} data-index={c.index} data-prop="value" onchange={handleChange}></lightning-combobox>
                    </template>
                    <template lwc:if={c.isDate}>
                        <lightning-input type="date" variant="label-hidden" label="Value" value={c.value} data-index={c.index} data-prop="value" onchange={handleChange}></lightning-input>
                    </template>
                    <template lwc:if={c.isNumber}>
                        <lightning-input type="number" step="any" variant="label-hidden" label="Value" placeholder="Number" value={c.value} data-index={c.index} data-prop="value" onchange={handleChange}></lightning-input>
                    </template>
                    <template lwc:if={c.isText}>
                        <lightning-input type="text" variant="label-hidden" label="Value" placeholder="Value" value={c.value} data-index={c.index} data-prop="value" onchange={handleChange}></lightning-input>
                    </template>
                    <template lwc:if={c.textValue}>
                        <lightning-input type="text" variant="label-hidden" label="Value" placeholder="Value" value={c.value} data-index={c.index} data-prop="value" onchange={handleChange}></lightning-input>
                    </template>
                    <lightning-button-icon icon-name="utility:delete" alternative-text="Remove condition" data-index={c.index} onclick={handleRemove}></lightning-button-icon>
                </div>
            </div>
        </div>
    </template>
    <lightning-button label="Add condition" icon-name="utility:add" onclick={handleAdd}></lightning-button>
    <template lwc:if={hasRows}>
        <lightning-input
            type="text"
            class="slds-m-top_x-small"
            label="How to combine them"
            placeholder="AND"
            field-level-help="Leave blank or type AND for all, OR for any, or write custom logic with the condition numbers, e.g. 1 AND (2 OR NOT 3)."
            value={logic}
            onchange={handleLogic}
        ></lightning-input>
    </template>
</template>
