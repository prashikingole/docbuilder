<template>
    <div class="shell">
        <template lwc:if={busy}>
            <lightning-spinner alternative-text="Working" size="medium"></lightning-spinner>
        </template>

        <!-- Top bar -->
        <header class="db-top">
            <div class="card crumb">
                <span class="logo" aria-hidden="true">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 2.5h5.5L12 5v8.5H4z"></path>
                        <path d="M6.5 8h3M6.5 10.5h3"></path>
                    </svg>
                </span>
                <lightning-combobox
                    class="template-picker"
                    label="Template"
                    variant="label-hidden"
                    placeholder="Choose a template"
                    options={templateOptions}
                    value={templateId}
                    onchange={handleTemplateChange}
                ></lightning-combobox>
                <template lwc:if={hasTemplate}>
                    <span class="ver" title={statusLabel}>{versionChip}</span>
                </template>
                <button type="button" class="btn ghost" onclick={toggleNew}>New</button>
                <button type="button" class="btn ghost" onclick={handleOpenImport}>Import</button>
                <template lwc:if={hasTemplate}>
                    <button type="button" class="btn ghost" title="Download this template to import into another org" onclick={handleExport}>Export</button>
                </template>
            </div>

            <template lwc:if={hasTemplate}>
                <div class="card seg" role="group" aria-label="View">
                    <template for:each={modeButtons} for:item="m">
                        <button key={m.value} type="button" class={m.cls} data-mode={m.value} aria-pressed={m.pressed} onclick={handleModeClick}>{m.label}</button>
                    </template>
                </div>
                <div class="top-actions">
                    <span class="saved"><span class={savedDotCls} aria-hidden="true"></span>{savedLabel}</span>
                    <button type="button" class="btn" title="Check that every field this template uses exists and is readable" onclick={handleCheck}>Check fields</button>
                    <button type="button" class="btn" onclick={handleSave}>Save draft</button>
                    <button type="button" class="btn primary" onclick={handleActivate}>Activate</button>
                </div>
            </template>
        </header>

        <template lwc:if={showImport}>
            <c-doc-builder-import onclose={handleCloseImport} onimported={handleImported}></c-doc-builder-import>
        </template>

        <template lwc:if={showNew}>
            <div class="card new-panel">
                <lightning-input label="Template name" value={newName} data-field="newName" onchange={handleNewField}></lightning-input>
                <lightning-input
                    label="Built on (object API name)"
                    value={newObject}
                    data-field="newObject"
                    field-level-help="The record type documents are generated from, e.g. Opportunity, Account, Case or My_Object__c."
                    onchange={handleNewField}
                ></lightning-input>
                <button type="button" class="btn primary" onclick={handleCreate}>Create</button>
                <button type="button" class="btn" onclick={toggleNew}>Cancel</button>
            </div>
        </template>

        <template lwc:if={health}>
            <div class={healthClass} role="status">{health.text}</div>
        </template>

        <template lwc:if={noTemplate}>
            <div class="card empty">
                <h2>Design a document without leaving Salesforce</h2>
                <p>Choose a template above, or create a new one. You will build it from blocks, drop in fields from a live list, and preview it with a real record.</p>
            </div>
        </template>

        <template lwc:if={hasTemplate}>
            <!-- DESIGN -->
            <template lwc:if={isDesign}>
                <div class="db-work">
                    <!-- Block rail -->
                    <nav class="card rail" aria-label="Add a block">
                        <button type="button" class="rail-btn" data-type="text" onclick={handleAddBlock}>
                            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 4h10M8 4v9"></path></svg>
                            Text
                        </button>
                        <button type="button" class="rail-btn" data-type="heading" onclick={handleAddBlock}>
                            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 3v10M12.5 3v10M3.5 8h9"></path></svg>
                            Heading
                        </button>
                        <button type="button" class="rail-btn" data-type="table" onclick={handleAddBlock}>
                            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M2.75 3.75h10.5v8.5H2.75zM2.75 7h10.5M6.5 7v5.25"></path></svg>
                            Table
                        </button>
                        <button type="button" class="rail-btn" data-type="image" onclick={handleAddBlock}>
                            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.75 3.75h10.5v8.5H2.75z"></path><path d="M4.5 10.5l2.5-2.5 2 2 1.5-1.5 1.5 1.5"></path></svg>
                            Image
                        </button>
                        <button type="button" class="rail-btn" data-type="terms" onclick={handleAddBlock}>
                            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 4.5h7M6 8h7M6 11.5h7M3 4.5h.01M3 8h.01M3 11.5h.01"></path></svg>
                            Terms
                        </button>
                        <button type="button" class="rail-btn" data-type="signature" onclick={handleAddBlock}>
                            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10.5c1.5-4 3-6 4-6s.5 5 1.5 5 1.500-2 2.500-2 1 2 3.500 2"></path><path d="M2 13.500h12"></path></svg>
                            Sign
                        </button>
                        <button type="button" class="rail-btn" data-type="pagebreak" onclick={handleAddBlock}>
                            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 2.5"><path d="M2 8h12"></path></svg>
                            Break
                        </button>
                        <button type="button" class="rail-btn" data-type="custom" title="Content from a Visualforce page or an Apex class" onclick={handleAddBlock}>
                            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 4.5L2 8l3.5 3.5M10.5 4.5L14 8l-3.5 3.5"></path></svg>
                            Custom
                        </button>
                    </nav>

                    <!-- Page -->
                    <main class="db-stage">
                        <div class="page" style={pageStyle}>
                            <template lwc:if={hasHeader}>
                                <div class="page-edge page-header">
                                    <span>
                                        <template lwc:if={logoUrl}><img src={logoUrl} style={logoStyle} alt="Header logo" /></template>
                                    </span>
                                    <span class="edge-text">
                                        <template for:each={headerSegs} for:item="s"><span key={s.key} class={s.cls}>{s.text}</span></template>
                                    </span>
                                </div>
                            </template>
                            <template lwc:if={noBlocks}>
                                <p class="hint centered">This template is empty. Add a block from the rail on the left, or open Fields on the right and click a field.</p>
                            </template>
                            <template for:each={blockRows} for:item="row">
                            <div key={row.key} class="brow">
                            <template for:each={row.cells} for:item="b">
                                <div
                                    key={b.id}
                                    class={b.cls}
                                    style={b.cellStyle}
                                    data-id={b.id}
                                    role="button"
                                    tabindex="0"
                                    draggable="true"
                                    onclick={handleSelect}
                                    onkeydown={handleBlockKey}
                                    ondragstart={handleDragStart}
                                    ondragover={handleDragOver}
                                    ondrop={handleDrop}
                                    ondragend={handleDragEnd}
                                >
                                    <template lwc:if={b.livePct}><span class="live-pct">{b.livePct}</span></template>
                                    <div class="block-head">
                                        <span class="block-type" title="Drag to move. Drop on the left or right edge of another block to place them side by side.">⠿ {b.label}</span>
                                        <span class="block-actions">
                                            <lightning-button-icon icon-name="utility:arrowup" variant="bare" alternative-text="Move up" data-id={b.id} data-delta="-1" disabled={b.first} onclick={handleMove}></lightning-button-icon>
                                            <lightning-button-icon icon-name="utility:arrowdown" variant="bare" alternative-text="Move down" data-id={b.id} data-delta="1" disabled={b.last} onclick={handleMove}></lightning-button-icon>
                                            <lightning-button-icon icon-name="utility:delete" variant="bare" alternative-text="Delete block" data-id={b.id} onclick={handleDelete}></lightning-button-icon>
                                        </span>
                                    </div>
                                    <template lwc:if={b.hasRule}>
                                        <div class="rule-tag">{b.rule}</div>
                                    </template>

                                    <template lwc:if={b.isBreak}>
                                        <div class="break">Page break</div>
                                    </template>
                                    <template lwc:if={b.isCustom}>
                                        <div class="custom-box">{b.customLabel}<span class="hint">Its content appears in Preview and in the PDF.</span></div>
                                    </template>
                                    <template lwc:if={b.empty}>
                                        <div class="hint">Empty. Type in Settings, or open Fields and click a field.</div>
                                    </template>
                                    <template lwc:if={b.isHeading}>
                                        <div class={b.textCls}>
                                            <template for:each={b.textSegs} for:item="s"><span key={s.key} class={s.cls} data-id={b.id} data-kind={s.kind} data-num={s.num} data-start={s.start} data-end={s.end} data-path={s.path} onclick={handleSegClick}>{s.text}</span></template>
                                        </div>
                                    </template>
                                    <template lwc:if={b.isText}>
                                        <div class={b.textCls}>
                                            <template for:each={b.textSegs} for:item="s"><span key={s.key} class={s.cls} data-id={b.id} data-kind={s.kind} data-num={s.num} data-start={s.start} data-end={s.end} data-path={s.path} onclick={handleSegClick}>{s.text}</span></template>
                                        </div>
                                    </template>
                                    <template lwc:if={b.hasLegend}>
                                        <div class="cond-legend">
                                            <template for:each={b.legend} for:item="l">
                                                <button key={l.key} type="button" class={l.cls} data-id={b.id} data-num={l.num} onclick={handleLegendClick}>
                                                    <span class="cond-badge">{l.label}</span>
                                                    <span>{l.text}</span>
                                                </button>
                                            </template>
                                        </div>
                                    </template>
                                    <template lwc:if={b.isRich}>
                                        <div class={b.richCls}>
                                            <lightning-formatted-rich-text value={b.richHtml} disable-linkify></lightning-formatted-rich-text>
                                        </div>
                                    </template>
                                    <template lwc:if={b.hasImage}>
                                        <div class={b.imgCls}><img src={b.imgUrl} style={b.imgStyle} alt="Image block" /></div>
                                    </template>
                                    <template lwc:if={b.noImage}>
                                        <div class="hint">No image yet. Upload one in Settings.</div>
                                    </template>
                                    <template lwc:if={b.isSignature}>
                                        <div class="sig-row">
                                            <template for:each={signatureAreas} for:item="a">
                                                <div key={a.key} class="sig-cell">
                                                    <div class="sig-line"></div>
                                                    <div class="sig-label">
                                                        {a.role}
                                                        <template for:each={a.segs} for:item="s"><span key={s.key} class={s.cls}>{s.text}</span></template>
                                                    </div>
                                                    <template lwc:if={b.sigShowName}><div class="sig-label">Name</div></template>
                                                    <template lwc:if={b.sigShowDate}><div class="sig-label">Date</div></template>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                    <template lwc:if={b.hasElse}>
                                        <div class="else">
                                            <span class="else-tag">Otherwise</span>
                                            <template for:each={b.elseSegs} for:item="s"><span key={s.key} class={s.cls}>{s.text}</span></template>
                                        </div>
                                    </template>

                                    <template lwc:if={b.isTable}>
                                        <div class="table-note">One row per record in <strong>{b.source}</strong></div>
                                        <template lwc:if={b.rowRule}>
                                            <div class="table-note">{b.rowRule}</div>
                                        </template>
                                        <template lwc:if={b.noColumns}>
                                            <div class="hint">No columns yet. Open Fields on the right and click the ones you want.</div>
                                        </template>
                                        <div class="grid-head">
                                            <template for:each={b.columns} for:item="c">
                                                <div key={c.key} class={c.cls} title={c.showTitle}>{c.header}<template lwc:if={c.conditional}><span class="col-cond" aria-label={c.showTitle}>if</span></template></div>
                                            </template>
                                        </div>
                                        <div class="grid-row">
                                            <template for:each={b.columns} for:item="c">
                                                <div key={c.key} class={c.cls}><span class="chip">{c.field}</span></div>
                                            </template>
                                        </div>
                                        <template for:each={b.totals} for:item="t">
                                            <div key={t.key} class="grid-total">
                                                <span>{t.label}</span><span class="chip chip-calc">{t.calc}</span>
                                            </div>
                                        </template>
                                    </template>

                                    <template lwc:if={b.isTerms}>
                                        <div class="terms-title">{b.title}</div>
                                        <template for:each={b.items} for:item="i">
                                            <div key={i.key} class="term">
                                                <span class="term-num">{i.num}</span>
                                                <span class="term-text">
                                                    <template for:each={i.segs} for:item="s"><span key={s.key} class={s.cls}>{s.text}</span></template>
                                                    <template lwc:if={i.hasRule}><span class="rule-tag inline">{i.rule}</span></template>
                                                </span>
                                            </div>
                                        </template>
                                        <template lwc:if={b.clauseCategory}>
                                            <div class="table-note">Plus every active library clause in category <strong>{b.clauseCategory}</strong></div>
                                        </template>
                                    </template>
                                </div>
                                <template lwc:if={b.handleAfter}>
                                    <div
                                        key={b.handleKey}
                                        class="col-handle"
                                        role="separator"
                                        aria-orientation="vertical"
                                        aria-label="Drag to change the widths of the blocks on each side"
                                        tabindex="0"
                                        data-left={b.id}
                                        data-right={b.nextId}
                                        onpointerdown={handleResizeStart}
                                        onpointermove={handleResizeMove}
                                        onpointerup={handleResizeEnd}
                                        onpointercancel={handleResizeEnd}
                                        onkeydown={handleResizeKey}
                                    ></div>
                                </template>
                            </template>
                            </div>
                            </template>
                            <template lwc:if={hasFooter}>
                                <div class="page-edge page-footer">
                                    <span class="edge-text">
                                        <template for:each={footerSegs} for:item="s"><span key={s.key} class={s.cls}>{s.text}</span></template>
                                    </span>
                                    <template lwc:if={footer.pageNumbers}><span>Page 1 of 1</span></template>
                                </div>
                            </template>
                        </div>
                    </main>

                    <!-- Inspector -->
                    <aside class="card inspector">
                        <div class="seg small" role="group" aria-label="Panel">
                            <template for:each={panelTabs} for:item="t">
                                <button key={t.value} type="button" class={t.cls} data-tab={t.value} aria-pressed={t.pressed} onclick={handlePanelTab}>{t.label}</button>
                            </template>
                        </div>

                        <!-- Settings -->
                        <template lwc:if={showSettings}>
                            <template lwc:if={sel}>
                                <button type="button" class="link-btn back-link" title="Deselect the block (Esc)" onclick={handleBackToTemplate}>‹ Template settings</button>
                                <div class="panel-title">
                                    <span class="eyebrow">Selected</span>
                                    <h2>{selLabel} block</h2>
                                </div>

                                <template lwc:if={selIsText}>
                                    <lightning-input type="checkbox" label="Rich text (bold, colours, lists, sizes)" checked={sel.rich} onchange={handleRichToggle}></lightning-input>
                                </template>
                                <template lwc:if={selIsRich}>
                                    <lightning-input-rich-text label="Text" label-visible value={sel.text} formats={richFormats} onchange={handleRichChange}></lightning-input-rich-text>
                                </template>
                                <template lwc:if={selIsImage}>
                                    <template lwc:if={selImageUrl}>
                                        <div class="thumb"><img src={selImageUrl} alt="Current image" /></div>
                                    </template>
                                    <lightning-file-upload label="Upload an image" name="blockImage" accept={imageFormats} record-id={templateId} onuploadfinished={handleImageUpload}></lightning-file-upload>
                                    <lightning-input type="number" label="Width in pixels" min="16" max="1000" value={sel.width} data-prop="width" onchange={handleProp}></lightning-input>
                                    <lightning-combobox label="Alignment" options={alignOptions} value={sel.align} data-prop="align" onchange={handleProp}></lightning-combobox>
                                </template>
                                <template lwc:if={selIsCustom}>
                                    <lightning-combobox label="Content from" options={customSourceOptions} value={sel.source} data-prop="source" onchange={handleProp}></lightning-combobox>
                                    <template lwc:if={selCustomIsVf}>
                                        <lightning-combobox label="Visualforce page" placeholder="Choose a page" options={vfPageOptions} value={sel.page} data-prop="page" onchange={handleProp}></lightning-combobox>
                                        <template lwc:if={noVfPages}><p class="hint">There are no Visualforce pages in this org yet.</p></template>
                                        <p class="hint">The page is opened for the record (as ?id=the record's Id) and its body is printed here. Build it without renderAs, using simple tables and inline styles. Scripts and forms are removed. Users need access to the page.</p>
                                    </template>
                                    <template lwc:if={selCustomIsApex}>
                                        <lightning-input type="text" label="Apex class" placeholder="e.g. AcmeWarrantyTable" value={sel.className} data-prop="className" onchange={handleProp}></lightning-input>
                                        <button type="button" class="btn small" onclick={handleCheckClass}>Check the class</button>
                                        <template lwc:if={classCheck}><p class={classCheckCls}>{classCheck.text}</p></template>
                                        <lightning-textarea label="Settings for the class" placeholder="Optional, e.g. JSON the class reads" value={sel.settings} data-prop="settings" onchange={handleProp}></lightning-textarea>
                                        <p class="hint">A developer writes a class that implements DocBuilderContentProvider and returns HTML for the record. See the developer guide.</p>
                                    </template>
                                    <lightning-combobox label="Alignment" options={alignOptions} value={sel.align} data-prop="align" onchange={handleProp}></lightning-combobox>
                                </template>
                                <template lwc:if={selIsSignature}>
                                    <p class="hint">One signing area is printed for each signer on this template. When the document is sent for e-signature, the provider places its signature, name and date fields here. Otherwise these print as lines to sign by hand.</p>
                                    <lightning-input type="checkbox" label="Include the date signed" checked={selShowDate} data-prop="showDate" onchange={handleProp}></lightning-input>
                                    <lightning-input type="checkbox" label="Include the signer's printed name" checked={sel.showName} data-prop="showName" onchange={handleProp}></lightning-input>
                                    <button type="button" class="link-btn" onclick={openSigners}>Edit who signs this document</button>
                                </template>
                                <template lwc:if={partView}>
                                    <div class="part-card">
                                        <template lwc:if={partView.isField}>
                                            <span class="eyebrow">Field in this text</span>
                                            <h3 class="part-title">{partView.label}</h3>
                                            <p class="hint">Make it conditional to leave it out when it's empty or when a rule isn't met. The comma or line break after it is left out with it.</p>
                                            <div class="row-line wrap">
                                                <button type="button" class="btn small primary" onclick={handleMakeConditional}>Show only if…</button>
                                                <button type="button" class="btn small" onclick={handleRemoveField}>Remove this field</button>
                                            </div>
                                        </template>
                                        <template lwc:if={partView.isSection}>
                                            <span class="eyebrow">Conditional part</span>
                                            <h3 class="part-title"><span class="cond-badge">{partView.num}</span> {partView.title}</h3>
                                            <lightning-textarea label="Text in this part" value={partView.ifText} onchange={handlePartText}></lightning-textarea>
                                            <p class="part-label">Print it only when</p>
                                            <template lwc:if={partView.sharedHint}><p class="hint">{partView.sharedHint}</p></template>
                                            <c-doc-builder-rule apex-checks={apexCheckNames} rule={partView.rule} object-name={baseObjectName} calc-names={calcNameList} onrulechange={handlePartRule}></c-doc-builder-rule>
                                            <lightning-textarea label="Otherwise print (optional)" value={partView.elseText} onchange={handlePartElse}></lightning-textarea>
                                            <div class="row-line wrap">
                                                <button type="button" class="btn small" onclick={handlePartUnwrap}>Always print it</button>
                                                <button type="button" class="btn small" onclick={handlePartDelete}>Delete this part</button>
                                            </div>
                                        </template>
                                        <button type="button" class="link-btn" onclick={handlePartClose}>Back to the whole block</button>
                                    </div>
                                </template>
                                <template lwc:if={selIsTextual}>
                                    <template lwc:if={selIsPlain}>
                                        <lightning-textarea label="Text" value={sel.text} data-prop="text" class="tall" onchange={handleProp} onfocus={handleFocus}></lightning-textarea>
                                        <p class="hint">Click a field on the page to make it conditional. Conditional parts show as green with a number; click one to change when it prints.</p>
                                    </template>
                                    <div class="soft">
                                        <lightning-combobox
                                            label="When you insert a field"
                                            options={wrapOptions}
                                            value={wrapMode}
                                            field-level-help="Choose 'Print it only when it has a value' before clicking fields such as address lines, so empty ones are left out."
                                            onchange={handleWrapMode}
                                        ></lightning-combobox>
                                        <button type="button" class="link-btn" data-tab="fields" onclick={handlePanelTab}>Insert a field into this text</button>
                                    </div>
                                    <template lwc:if={selIsHeading}>
                                        <lightning-combobox label="Size" options={levelOptions} value={sel.level} data-prop="level" onchange={handleProp}></lightning-combobox>
                                    </template>
                                    <lightning-combobox label="Alignment" options={alignOptions} value={sel.align} data-prop="align" onchange={handleProp}></lightning-combobox>
                                </template>

                                <template lwc:if={selIsTable}>
                                    <lightning-combobox label="Rows come from" placeholder="Choose a related list" options={sourceOptions} value={sel.source} data-prop="source" onchange={handleProp}></lightning-combobox>
                                    <lightning-input type="text" label="Or a list on a related record" placeholder="e.g. Account.Contacts" value={sel.source} data-prop="source" onchange={handleProp}></lightning-input>

                                    <h3>Columns</h3>
                                    <template for:each={sel.columns} for:item="c">
                                        <div key={c.index} class="row-card">
                                            <div class="row-line">
                                                <lightning-input type="text" label="Heading" value={c.header} data-list="columns" data-index={c.index} data-prop="header" onchange={handleRow}></lightning-input>
                                                <lightning-button-icon icon-name="utility:delete" alternative-text="Remove column" class="row-remove" data-list="columns" data-index={c.index} onclick={handleRemoveRow}></lightning-button-icon>
                                            </div>
                                            <lightning-input type="text" label="Field" value={c.field} data-list="columns" data-index={c.index} data-prop="field" onchange={handleRow}></lightning-input>
                                            <div class="row-line">
                                                <lightning-combobox label="Align" options={alignOptions} value={c.align} data-list="columns" data-index={c.index} data-prop="align" onchange={handleRow}></lightning-combobox>
                                                <lightning-combobox label="Format" options={formatOptions} value={c.format} data-list="columns" data-index={c.index} data-prop="format" onchange={handleRow}></lightning-combobox>
                                            </div>
                                            <lightning-combobox
                                                label="Show this column"
                                                options={columnShowOptions}
                                                value={c.show}
                                                data-list="columns"
                                                data-index={c.index}
                                                data-prop="show"
                                                field-level-help="'Only when some row has a value' leaves the column out when every row in the table is blank or zero, for example a Discount column when nothing is discounted."
                                                onchange={handleRow}
                                            ></lightning-combobox>
                                            <template lwc:if={c.showRule}>
                                                <p class="hint">Show the column only if</p>
                                                <c-doc-builder-rule apex-checks={apexCheckNames} rule={c.showIf} object-name={baseObjectName} calc-names={calcNameList} data-target="column" data-index={c.index} onrulechange={handleRule}></c-doc-builder-rule>
                                            </template>
                                        </div>
                                    </template>
                                    <button type="button" class="link-btn" data-tab="fields" onclick={handlePanelTab}>Add columns from the field list</button>

                                    <h3>Which rows to include</h3>
                                    <c-doc-builder-rule apex-checks={apexCheckNames} rule={sel.rowFilter} object-name={tableObject} data-target="rowFilter" onrulechange={handleRule}></c-doc-builder-rule>

                                    <h3>Sorting</h3>
                                    <div class="row-line">
                                        <template lwc:if={hasSortOptions}>
                                            <lightning-combobox label="Sort by field" options={sortOptions} value={sel.orderBy} data-prop="orderBy" onchange={handleProp}></lightning-combobox>
                                        </template>
                                        <template lwc:else>
                                            <lightning-input type="text" label="Sort by field" value={sel.orderBy} data-prop="orderBy" onchange={handleProp}></lightning-input>
                                        </template>
                                        <lightning-combobox label="Direction" options={directionOptions} value={sel.orderDirection} data-prop="orderDirection" onchange={handleProp}></lightning-combobox>
                                    </div>

                                    <h3>Group rows</h3>
                                    <template lwc:if={tableObject}>
                                        <c-doc-builder-field-picker object-name={tableObject} value={sel.groupBy} label="Group rows by" variant="standard" allow-skip={falseValue} data-prop="groupBy" onchange={handleProp}></c-doc-builder-field-picker>
                                        <template lwc:if={sel.groupBy}>
                                            <button type="button" class="link-btn" data-prop="groupBy" onclick={handleClearGroup}>Don't group</button>
                                            <lightning-input type="checkbox" label="Show the summary rows for each group too" checked={sel.groupTotals} data-prop="groupTotals" onchange={handleProp}></lightning-input>
                                        </template>
                                        <p class="hint">Each group gets a heading row, for example line items grouped by Quote › Name when the rows come from a data source over several quotes. Groups follow the table's sort order, so sort by the same field.</p>
                                    </template>

                                    <h3>Summary rows</h3>
                                    <template for:each={sel.totals} for:item="t">
                                        <div key={t.index} class="row-line">
                                            <lightning-input type="text" label="Label" value={t.label} data-list="totals" data-index={t.index} data-prop="label" onchange={handleRow}></lightning-input>
                                            <lightning-combobox label="Calculated value" options={calcOptions} value={t.calc} data-list="totals" data-index={t.index} data-prop="calc" onchange={handleRow}></lightning-combobox>
                                            <lightning-button-icon icon-name="utility:delete" alternative-text="Remove summary row" class="row-remove" data-list="totals" data-index={t.index} onclick={handleRemoveRow}></lightning-button-icon>
                                        </div>
                                    </template>
                                    <div class="row-line wrap">
                                        <button type="button" class="btn small" data-list="totals" onclick={handleAddRow}>Add summary row</button>
                                        <button type="button" class="btn small" onclick={handleMatchingTotal}>Add a total for these rows</button>
                                    </div>
                                    <p class="hint">A summary row that totals this table's list adds up only the rows the table shows, after its row filter. "Add a total for these rows" creates one for you.</p>
                                    <lightning-input type="checkbox" class="slds-m-top_small" label="Hide the table when there are no rows" checked={sel.hideWhenEmpty} data-prop="hideWhenEmpty" onchange={handleProp}></lightning-input>
                                </template>

                                <template lwc:if={selIsTerms}>
                                    <lightning-input type="text" label="Title" value={sel.title} data-prop="title" onchange={handleProp}></lightning-input>
                                    <h3>Clauses in this template</h3>
                                    <template for:each={sel.items} for:item="i">
                                        <div key={i.id} class="row-card">
                                            <div class="row-line">
                                                <lightning-textarea label="Clause text" value={i.text} data-list="items" data-index={i.index} data-prop="itemText" onchange={handleItemText} onfocus={handleFocus}></lightning-textarea>
                                                <lightning-button-icon icon-name="utility:delete" alternative-text="Remove clause" class="row-remove" data-list="items" data-index={i.index} onclick={handleRemoveRow}></lightning-button-icon>
                                            </div>
                                            <p class="hint">Print this clause only if</p>
                                            <c-doc-builder-rule apex-checks={apexCheckNames} rule={i.showIf} object-name={baseObjectName} calc-names={calcNameList} data-target="item" data-index={i.index} onrulechange={handleRule}></c-doc-builder-rule>
                                        </div>
                                    </template>
                                    <button type="button" class="btn small" data-list="items" onclick={handleAddRow}>Add clause</button>
                                    <lightning-input
                                        type="text"
                                        class="slds-m-top_small"
                                        label="Also include library clauses in category"
                                        placeholder="e.g. Standard"
                                        field-level-help="Clauses are kept on the Document Clauses tab and shared by every template that names their category."
                                        value={sel.clauseCategory}
                                        data-prop="clauseCategory"
                                        onchange={handleProp}
                                    ></lightning-input>
                                </template>

                                <template lwc:if={selCanLayout}>
                                    <h3>Layout</h3>
                                    <div class="row-line">
                                        <lightning-combobox label="Width" options={selSpanOptions} value={selSpan} data-prop="span" onchange={handleSpan}></lightning-combobox>
                                    </div>
                                    <lightning-input type="checkbox" label="Place beside the block above" checked={sel.beside} disabled={selIsFirst} data-prop="beside" onchange={handleProp}></lightning-input>
                                    <p class="hint">Easiest on the page: drag a block onto the left or right edge of another to put them side by side (up to four in a row), then drag the line between them to change the widths.</p>
                                </template>

                                <template lwc:if={selHasRule}>
                                    <h3>Visibility: show this block only if</h3>
                                    <div class="soft">
                                        <c-doc-builder-rule apex-checks={apexCheckNames} rule={sel.showIf} object-name={baseObjectName} calc-names={calcNameList} data-target="showIf" onrulechange={handleRule}></c-doc-builder-rule>
                                    </div>
                                    <template lwc:if={selIsTextual}>
                                        <lightning-textarea label="Otherwise show this text instead" value={sel.elseText} data-prop="elseText" onchange={handleProp} onfocus={handleFocus}></lightning-textarea>
                                    </template>
                                </template>
                            </template>

                            <template lwc:else>
                                <template lwc:if={isPanelMenu}>
                                    <div class="panel-title">
                                        <span class="eyebrow">Template</span>
                                        <h2>{panelTitle}</h2>
                                    </div>
                                    <p class="hint">Click a block on the page to edit it, or open a section below for settings that apply to the whole document.</p>
                                    <nav class="settings-menu" aria-label="Template settings">
                                        <template for:each={settingsMenu} for:item="m">
                                            <button key={m.panel} type="button" class="menu-item" data-panel={m.panel} onclick={handleDock}>
                                                <span class="menu-text">
                                                    <span class="menu-label">{m.label}</span>
                                                    <span class="menu-detail">{m.detail}</span>
                                                </span>
                                                <span class="menu-chevron" aria-hidden="true">›</span>
                                            </button>
                                        </template>
                                    </nav>
                                </template>
                                <template lwc:else>
                                    <button type="button" class="link-btn back-link" onclick={handleSettingsMenu}>‹ All template settings</button>
                                    <div class="panel-title">
                                        <span class="eyebrow">Template</span>
                                        <h2>{panelTitle}</h2>
                                    </div>
                                </template>

                                <template lwc:if={isPanelTemplate}>
                                    <lightning-input type="text" label="Template name" value={name} data-field="name" onchange={handleSetting}></lightning-input>
                                    <lightning-input
                                        type="text"
                                        label="File name"
                                        placeholder={fileNameHint}
                                        field-level-help="Click here, then open Fields and click a field to add it to the file name."
                                        value={fileNamePattern}
                                        data-field="fileNamePattern"
                                        data-prop="fileNamePattern"
                                        onchange={handleSetting}
                                        onfocus={handleFocus}
                                    ></lightning-input>
                                    <lightning-input
                                        type="text"
                                        label="Languages"
                                        placeholder="e.g. en, fr, de"
                                        field-level-help="Comma separated codes. Translate the extra languages in the Translate view."
                                        value={languages}
                                        data-field="languages"
                                        onchange={handleSetting}
                                    ></lightning-input>
                                </template>

                                <template lwc:if={isPanelPage}>
                                    <lightning-combobox label="Paper size" options={pageSizeOptions} value={page.size} data-prop="size" onchange={handlePage}></lightning-combobox>
                                    <lightning-combobox label="Orientation" options={orientationOptions} value={page.orientation} data-prop="orientation" onchange={handlePage}></lightning-combobox>
                                    <lightning-combobox label="Margins" options={marginOptions} value={page.margin} data-prop="margin" onchange={handlePage}></lightning-combobox>
                                </template>

                                <template lwc:if={isPanelHeaderFooter}>
                                    <h3>Header, repeated on every page</h3>
                                    <template lwc:if={logoUrl}>
                                        <div class="thumb"><img src={logoUrl} alt="Current logo" /></div>
                                        <div class="row-line">
                                            <lightning-input type="number" label="Logo width in pixels" min="16" max="600" value={header.logoWidth} data-section="header" data-prop="logoWidth" onchange={handlePage}></lightning-input>
                                            <button type="button" class="btn small row-remove" onclick={handleRemoveLogo}>Remove</button>
                                        </div>
                                    </template>
                                    <lightning-file-upload label="Logo" name="headerLogo" accept={imageFormats} record-id={templateId} onuploadfinished={handleLogoUpload}></lightning-file-upload>
                                    <lightning-input
                                        type="text"
                                        label="Header text"
                                        field-level-help="Shown at the top right of every page. Click here, then open Fields to add a field."
                                        value={header.text}
                                        data-section="header"
                                        data-prop="text"
                                        data-focus="headerText"
                                        onchange={handlePage}
                                        onfocus={handlePageFocus}
                                    ></lightning-input>

                                    <h3>Footer, repeated on every page</h3>
                                    <lightning-input type="text" label="Footer text" value={footer.text} data-section="footer" data-prop="text" data-focus="footerText" onchange={handlePage} onfocus={handlePageFocus}></lightning-input>
                                    <lightning-input type="checkbox" label="Show page numbers (Page 1 of 3)" checked={footer.pageNumbers} data-section="footer" data-prop="pageNumbers" onchange={handlePage}></lightning-input>

                                    <h3>Watermark</h3>
                                    <lightning-input type="text" label="Watermark text" placeholder="e.g. CONFIDENTIAL" value={watermark.text} data-section="watermark" data-prop="text" data-focus="watermarkText" onchange={handlePage} onfocus={handlePageFocus}></lightning-input>
                                    <lightning-combobox label="Direction" options={watermarkDirectionOptions} value={watermarkDirection} data-section="watermark" data-prop="direction" onchange={handlePage}></lightning-combobox>
                                    <template lwc:if={watermarkDiagonalWithFields}>
                                        <p class="hint">A diagonal watermark is drawn once when you save, so it can't contain fields. This one prints across the page instead.</p>
                                    </template>
                                    <div class="pair">
                                        <lightning-combobox label="Size" options={watermarkSizeOptions} value={watermarkSize} data-section="watermark" data-prop="size" onchange={handlePage}></lightning-combobox>
                                        <lightning-combobox label="Shade" options={watermarkShadeOptions} value={watermarkShade} data-section="watermark" data-prop="shade" onchange={handlePage}></lightning-combobox>
                                    </div>
                                    <p class="hint">The direction, size and shade also apply to the DRAFT mark on draft documents.</p>
                                    <p class="hint">Show the watermark only if (leave empty to show it always)</p>
                                    <div class="soft">
                                        <c-doc-builder-rule apex-checks={apexCheckNames} rule={watermark.showIf} object-name={baseObjectName} calc-names={calcNameList} onrulechange={handleWatermarkRule}></c-doc-builder-rule>
                                    </div>
                                </template>

                                <template lwc:if={isPanelSigners}>
                                    <p class="hint">Who signs this document, in signing order. Type a name and email, or click a box and then pick a field from the Fields tab so they come from the record.</p>
                                    <template for:each={signerRows} for:item="s">
                                        <div key={s.index} class="row-card">
                                            <div class="row-line">
                                                <lightning-input type="text" label="Role" placeholder="e.g. Customer" value={s.role} data-list="signers" data-index={s.index} data-prop="role" onchange={handleRow}></lightning-input>
                                                <lightning-button-icon icon-name="utility:delete" alternative-text="Remove signer" class="row-remove" data-list="signers" data-index={s.index} onclick={handleRemoveRow}></lightning-button-icon>
                                            </div>
                                            <lightning-combobox label="Who signs" options={signerModeOptions} value={s.mode} data-index={s.index} onchange={handleSignerMode}></lightning-combobox>
                                            <template lwc:if={s.isPerson}>
                                                <lightning-combobox
                                                    label="Person on this record"
                                                    placeholder="Choose a person"
                                                    options={personOptions}
                                                    value={s.person}
                                                    data-index={s.index}
                                                    field-level-help="Name and email are read from this person when the document is sent."
                                                    onchange={handleSignerPerson}
                                                ></lightning-combobox>
                                            </template>
                                            <template lwc:if={s.isList}>
                                                <lightning-combobox label="Everyone in this list" placeholder="Choose a related list" options={signerListOptions} value={s.source} data-index={s.index} onchange={handleSignerList}></lightning-combobox>
                                                <div class="row-line">
                                                    <lightning-input type="text" label="Name field" placeholder="e.g. Contact.Name" value={s.nameField} data-list="signers" data-index={s.index} data-prop="nameField" onchange={handleRow}></lightning-input>
                                                    <lightning-input type="text" label="Email field" placeholder="e.g. Contact.Email" value={s.emailField} data-list="signers" data-index={s.index} data-prop="emailField" onchange={handleRow}></lightning-input>
                                                </div>
                                                <p class="hint">Only include rows where (leave empty for everyone). People without an email address are left out.</p>
                                                <c-doc-builder-rule apex-checks={apexCheckNames} rule={s.filter} object-name={s.ruleObject} data-index={s.index} onrulechange={handleSignerFilter}></c-doc-builder-rule>
                                            </template>
                                            <template lwc:if={s.isTyped}>
                                                <lightning-input type="text" label="Name" value={s.name} data-list="signers" data-index={s.index} data-prop="name" onchange={handleRow} onfocus={handleSignerFocus}></lightning-input>
                                                <lightning-input type="text" label="Email" value={s.email} data-list="signers" data-index={s.index} data-prop="email" onchange={handleRow} onfocus={handleSignerFocus}></lightning-input>
                                                <p class="hint">Type them, or click a box and pick a field from the Fields tab.</p>
                                            </template>
                                        </div>
                                    </template>
                                    <button type="button" class="btn small" data-list="signers" onclick={handleAddRow}>Add signer</button>
                                    <template lwc:if={noSigners}>
                                        <p class="hint">With no signers, a signature block prints one plain line and the document cannot be sent for e-signature.</p>
                                    </template>

                                    <h3>Signature providers</h3>
                                    <p class="hint">Only providers switched on in Setup › Custom Metadata Types › Signature Provider appear when sending. Test a provider here before switching it on.</p>
                                    <template for:each={providerRows} for:item="p">
                                        <div key={p.name} class="row-card">
                                            <div class="row-line provider-line">
                                                <span class="provider-name">{p.label}</span>
                                                <span class={p.stateCls}>{p.state}</span>
                                                <button type="button" class="btn small" data-name={p.name} onclick={handleTestProvider}>Test connection</button>
                                            </div>
                                            <template lwc:if={p.result}><p class={p.resultCls}>{p.result}</p></template>
                                        </div>
                                    </template>
                                </template>

                                <template lwc:if={isPanelData}>
                                    <p class="hint">
                                        Fetch records that aren't a direct list of this record: a list on a related record's related record, or records that only match by a value, such as the account's active contracts.
                                        Use a source as a table's rows, in calculated values, or print a value from its first row from the Fields tab.
                                    </p>
                                    <template for:each={dataSourceRows} for:item="d">
                                        <div key={d.key} class="row-card ds-card">
                                            <div class="row-line">
                                                <lightning-input type="text" label="Name" value={d.name} data-index={d.index} data-prop="name" field-level-help="Letters, digits and underscores. Used as ds:Name in the template." onchange={handleDsProp}></lightning-input>
                                                <lightning-button-icon icon-name="utility:delete" alternative-text="Remove data source" class="row-remove" data-index={d.index} onclick={handleRemoveDataSource}></lightning-button-icon>
                                            </div>
                                            <lightning-combobox label="Records of" placeholder="Choose an object" options={d.objectOptions} value={d.object} data-index={d.index} data-prop="object" onchange={handleDsProp}></lightning-combobox>
                                            <template lwc:if={d.hasObject}>
                                                <h4 class="ds-sub">Only records where</h4>
                                                <template for:each={d.filters} for:item="f">
                                                    <div key={f.key} class="ds-filter">
                                                        <c-doc-builder-field-picker object-name={d.object} value={f.field} label="Field" data-index={d.index} data-findex={f.findex} data-prop="field" onchange={handleDsFilter}></c-doc-builder-field-picker>
                                                        <div class="pair">
                                                            <lightning-combobox variant="label-hidden" label="Comparison" options={f.opOptions} value={f.op} data-index={d.index} data-findex={f.findex} data-prop="op" onchange={handleDsFilter}></lightning-combobox>
                                                            <lightning-combobox variant="label-hidden" label="Compare with" options={dsFromOptions} value={f.from} data-index={d.index} data-findex={f.findex} data-prop="from" onchange={handleDsFilter}></lightning-combobox>
                                                        </div>
                                                        <template lwc:if={f.isValue}>
                                                            <lightning-input type="text" variant="label-hidden" label="Value" placeholder="e.g. Activated, 2026-01-31 or 1000" value={f.value} data-index={d.index} data-findex={f.findex} data-prop="value" onchange={handleDsFilter}></lightning-input>
                                                        </template>
                                                        <template lwc:if={f.isRecord}>
                                                            <c-doc-builder-field-picker object-name={baseObjectName} value={f.recordField} label="Field on this record" variant="standard" data-index={d.index} data-findex={f.findex} data-prop="recordField" onchange={handleDsFilter}></c-doc-builder-field-picker>
                                                        </template>
                                                        <template lwc:if={f.isList}>
                                                            <lightning-combobox label="List" placeholder="Choose a list" options={f.listChoices} value={f.list} data-index={d.index} data-findex={f.findex} data-prop="list" onchange={handleDsFilter}></lightning-combobox>
                                                            <template lwc:if={f.listObject}>
                                                                <c-doc-builder-field-picker object-name={f.listObject} value={f.listField} label="Field in that list" variant="standard" data-index={d.index} data-findex={f.findex} data-prop="listField" onchange={handleDsFilter}></c-doc-builder-field-picker>
                                                            </template>
                                                        </template>
                                                        <button type="button" class="link-btn" data-index={d.index} data-findex={f.findex} onclick={handleRemoveDsFilter}>Remove this filter</button>
                                                    </div>
                                                </template>
                                                <button type="button" class="btn small" data-index={d.index} onclick={handleAddDsFilter}>Add filter</button>
                                                <template lwc:if={d.hasFilters}>
                                                    <lightning-combobox label="Records must match" options={dsMatchOptions} value={d.match} data-index={d.index} data-prop="match" onchange={handleDsProp}></lightning-combobox>
                                                </template>
                                                <h4 class="ds-sub">Order and size</h4>
                                                <c-doc-builder-field-picker object-name={d.object} value={d.orderBy} label="Sort by" variant="standard" data-index={d.index} data-prop="orderBy" onchange={handleDsProp}></c-doc-builder-field-picker>
                                                <div class="pair">
                                                    <lightning-combobox label="Direction" options={dsDirectionOptions} value={d.orderDirection} data-index={d.index} data-prop="orderDirection" onchange={handleDsProp}></lightning-combobox>
                                                    <lightning-input type="number" label="At most" min="1" max="500" value={d.limit} data-index={d.index} data-prop="limit" onchange={handleDsProp}></lightning-input>
                                                </div>
                                                <p class="hint">In text: {d.usage} prints that field from the first record. Data sources load in this order, so a filter can use the lists and sources above it.</p>
                                            </template>
                                        </div>
                                    </template>
                                    <template lwc:if={canAddDataSource}>
                                        <button type="button" class="btn small" onclick={handleAddDataSource}>Add data source</button>
                                    </template>
                                </template>

                                <template lwc:if={isPanelVersions}>
                                    <p class="hint">Every saved version is kept. Put an earlier one live to undo a change straight away, or copy it into the draft to change it before activating.</p>
                                    <template for:each={versionRows} for:item="v">
                                        <div key={v.id} class="row-card">
                                            <div class="row-line">
                                                <span class="provider-name">{v.title}</span>
                                                <span class={v.stateCls}>{v.state}</span>
                                            </div>
                                            <p class="hint">{v.detail}</p>
                                            <div class="row-line ver-actions">
                                                <template lwc:if={v.canMakeLive}>
                                                    <button type="button" class="btn small" data-id={v.id} data-number={v.number} onclick={handleMakeLive}>Put live</button>
                                                </template>
                                                <template lwc:if={v.canCopy}>
                                                    <button type="button" class="btn small" data-id={v.id} data-number={v.number} onclick={handleCopyToDraft}>Edit a copy</button>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </template>

                                <template lwc:if={isPanelMessages}>
                                    <p class="hint">The wording used when this document is emailed or sent for signature. Click a box, then pick fields from the Fields tab; conditions such as {ifExample} work too. Senders can still change it before sending.</p>
                                    <h3>Emailing the PDF</h3>
                                    <lightning-input type="text" label="Subject" placeholder="Defaults to the file name" value={messages.emailSubject} data-key="emailSubject" onchange={handleMessage} onfocus={handleMessageFocus}></lightning-input>
                                    <lightning-textarea label="Message" placeholder="Please find the document attached." value={messages.emailBody} data-key="emailBody" onchange={handleMessage} onfocus={handleMessageFocus}></lightning-textarea>
                                    <h3>Sending for signature</h3>
                                    <lightning-input type="text" label="Subject" placeholder="Defaults to: Please sign, plus the file name" value={messages.signSubject} data-key="signSubject" onchange={handleMessage} onfocus={handleMessageFocus}></lightning-input>
                                    <lightning-textarea label="Message to signers" value={messages.signMessage} data-key="signMessage" onchange={handleMessage} onfocus={handleMessageFocus}></lightning-textarea>
                                </template>

                                <template lwc:if={isPanelConditions}>
                                    <p class="hint">You don't need this to make a field conditional: click the field on the page and choose "Show only if…". Use shared conditions only when the same rule is reused in several texts; use one as {condExample} … {endIfExample}.</p>
                                    <template for:each={conditionRows} for:item="c">
                                        <div key={c.index} class="row-card">
                                            <div class="row-line">
                                                <lightning-input type="text" label="Name" placeholder="e.g. NotDelhi" value={c.name} data-list="conditions" data-index={c.index} data-prop="name" onchange={handleRow}></lightning-input>
                                                <lightning-button-icon icon-name="utility:delete" alternative-text="Remove condition" class="row-remove" data-list="conditions" data-index={c.index} onclick={handleRemoveRow}></lightning-button-icon>
                                            </div>
                                            <p class="hint">True when</p>
                                            <c-doc-builder-rule apex-checks={apexCheckNames} rule={c.rule} object-name={baseObjectName} calc-names={calcNameList} data-index={c.index} onrulechange={handleConditionRule}></c-doc-builder-rule>
                                            <p class="hint">In text: {c.usage}</p>
                                        </div>
                                    </template>
                                    <button type="button" class="btn small" data-list="conditions" onclick={handleAddRow}>Add condition</button>

                                    <h3>Apex variables</h3>
                                    <p class="hint">Values worked out by an Apex class a developer wrote, for logic a rule can't express. One class can offer many values: add a variable for each one you need. A variable appears as "Apex: Name" in every rule's field list. In text, {apexCheckExample} prints it, or pick it in the Fields tab.</p>
                                    <template for:each={apexCheckRows} for:item="c">
                                        <div key={c.index} class="row-card">
                                            <div class="row-line">
                                                <lightning-input type="text" label="Name" placeholder="e.g. HighPriorityCases" value={c.name} data-list="apexChecks" data-index={c.index} data-prop="name" field-level-help="Letters, digits and underscores." onchange={handleRow}></lightning-input>
                                                <lightning-button-icon icon-name="utility:delete" alternative-text="Remove Apex check" class="row-remove" data-list="apexChecks" data-index={c.index} onclick={handleRemoveRow}></lightning-button-icon>
                                            </div>
                                            <lightning-input type="text" label="Apex class" placeholder="e.g. DocBuilderSampleAccountVariables" value={c.className} data-list="apexChecks" data-index={c.index} data-prop="className" onchange={handleRow}></lightning-input>
                                            <button type="button" class="btn small" data-index={c.index} onclick={handleCheckCondition}>Check the class</button>
                                            <template lwc:if={c.result}><p class={c.resultCls}>{c.result}</p></template>
                                            <template lwc:if={c.hasValues}>
                                                <lightning-combobox label="Value" placeholder="Choose a value" options={c.variableOptions} value={c.variable} data-index={c.index} onchange={handleApexVariable}></lightning-combobox>
                                            </template>
                                            <template lwc:if={c.typeLabel}><p class="hint">{c.typeLabel}</p></template>
                                            <lightning-input type="text" label="Settings for the class" placeholder={checkSettingsHint} value={c.settings} data-list="apexChecks" data-index={c.index} data-prop="settings" onchange={handleRow}></lightning-input>
                                            <template lwc:if={c.usage}><p class="hint">In text: {c.usage}</p></template>
                                        </div>
                                    </template>
                                    <button type="button" class="btn small" data-list="apexChecks" onclick={handleAddRow}>Add Apex variable</button>
                                </template>

                                <template lwc:if={isPanelCalc}>
                                    <p class="hint">Totals over a list, or a formula on the record. Place one in text by picking it in the Fields tab or typing calc: and its name inside double braces.</p>
                                    <lightning-record-picker class="record-picker" label="Try them with this record" placeholder="Search records" object-api-name={baseObjectName} value={previewRecordId} onchange={handleCalcRecord}></lightning-record-picker>
                                    <template lwc:if={calcNoRecord}><p class="hint">Pick a record to see each value worked out as you type.</p></template>
                                    <template lwc:if={calcPreviewProblem}><div class="health bad" role="alert">{calcPreviewProblem}</div></template>
                                    <template for:each={calcRows} for:item="c">
                                        <div key={c.index} class="row-card">
                                            <div class="row-line">
                                                <lightning-input type="text" label="Name" placeholder="e.g. Subtotal" value={c.name} data-list="calculations" data-index={c.index} data-prop="name" onchange={handleRow}></lightning-input>
                                                <lightning-button-icon icon-name="utility:delete" alternative-text="Remove calculated value" class="row-remove" data-list="calculations" data-index={c.index} onclick={handleRemoveRow}></lightning-button-icon>
                                            </div>
                                            <lightning-combobox label="Type" options={calcTypeOptions} value={c.type} data-list="calculations" data-index={c.index} data-prop="type" onchange={handleRow}></lightning-combobox>
                                            <template lwc:if={c.isRollup}>
                                                <lightning-combobox label="Over the list" placeholder="Choose a related list" options={c.listOptions} value={c.source} data-list="calculations" data-index={c.index} data-prop="source" onchange={handleRow}></lightning-combobox>
                                            </template>
                                            <template lwc:if={c.needsField}>
                                                <template lwc:if={c.fieldPicker}>
                                                    <lightning-combobox label="Field to total" placeholder="Choose a number field" options={c.numericOptions} value={c.field} data-list="calculations" data-index={c.index} data-prop="field" onchange={handleRow}></lightning-combobox>
                                                </template>
                                                <template lwc:else>
                                                    <lightning-input type="text" label="Field to total" placeholder="e.g. TotalPrice" value={c.field} data-list="calculations" data-index={c.index} data-prop="field" onchange={handleRow}></lightning-input>
                                                </template>
                                            </template>
                                            <template lwc:if={c.isRollup}>
                                                <p class="hint">Only count rows where (leave empty for all rows)</p>
                                                <c-doc-builder-rule apex-checks={apexCheckNames} rule={c.filter} object-name={c.childObject} data-index={c.index} onrulechange={handleCalcFilter}></c-doc-builder-rule>
                                            </template>
                                            <template lwc:if={c.isFormula}>
                                                <div class="fx-wrap">
                                                    <label class="fx-label" for={c.fxInputId}>Formula</label>
                                                    <div class="fx-bar">
                                                        <span class="fx-mark" aria-hidden="true">fx</span>
                                                        <input
                                                            id={c.fxInputId}
                                                            class="fx-input"
                                                            type="text"
                                                            autocomplete="off"
                                                            spellcheck="false"
                                                            placeholder="Start typing a field, e.g. Amount * 0.9"
                                                            value={c.expression}
                                                            data-index={c.index}
                                                            oninput={handleFormulaInput}
                                                            onkeydown={handleFormulaKey}
                                                            onblur={handleFormulaBlur}
                                                        />
                                                    </div>
                                                    <template lwc:if={c.showSuggest}>
                                                        <div class="fx-suggest" role="listbox" aria-label="Suggestions">
                                                            <template for:each={c.suggestions} for:item="s">
                                                                <div key={s.key} class={s.cls} role="option" data-i={s.i} onmousedown={handleSuggestPick}>
                                                                    <span class="fx-item-label">{s.label}</span>
                                                                    <span class="fx-item-detail">{s.detail}</span>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </template>
                                                    <div class="fx-read" aria-label="The formula as it reads">
                                                        <template for:each={c.fxSegs} for:item="s"><span key={s.key} class={s.cls} title={s.title}>{s.text}</span></template>
                                                    </div>
                                                    <template lwc:if={c.fxProblem}><p class="fx-problem">{c.fxProblem}</p></template>
                                                    <p class="hint">{fxHelp}</p>
                                                </div>
