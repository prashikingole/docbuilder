                                            </template>
                                            <template lwc:if={c.hasResult}><div class="fx-result">{c.result}</div></template>
                                            <lightning-combobox label="Show as" options={formatOptions} value={c.format} data-list="calculations" data-index={c.index} data-prop="format" onchange={handleRow}></lightning-combobox>
                                        </div>
                                    </template>
                                    <button type="button" class="btn small" data-list="calculations" onclick={handleAddRow}>Add calculated value</button>
                                </template>
                            </template>
                        </template>

                        <!-- Fields -->
                        <template lwc:if={showFields}>
                            <div class="panel-title">
                                <span class="eyebrow">Insert a field</span>
                                <h2>{pickerTitle}</h2>
                            </div>
                            <p class="hint">{pickerHint}</p>
                            <div class="search-row">
                                <template lwc:if={canGoBack}>
                                    <lightning-button-icon icon-name="utility:back" alternative-text="Back" onclick={handleBack}></lightning-button-icon>
                                </template>
                                <lightning-input class="search" type="search" label="Search fields" variant="label-hidden" placeholder="Search fields" value={search} onchange={handleSearch}></lightning-input>
                            </div>
                            <div class="pick-list">
                                <template for:each={pickerFields} for:item="f">
                                    <button key={f.key} type="button" class="pick" data-path={f.path} data-label={f.label} data-type={f.type} onclick={handlePick}>
                                        <span class="pick-label">{f.label}</span>
                                        <span class="pick-type">{f.type}</span>
                                    </button>
                                </template>
                            </div>
                            <template lwc:if={hasPickerApexVariables}>
                                <h3>Apex variables</h3>
                                <div class="pick-list short">
                                    <template for:each={pickerApexVariables} for:item="v">
                                        <button key={v.key} type="button" class="pick" data-path={v.path} data-label={v.label} data-type={v.type} onclick={handlePick}>
                                            <span class="pick-label">{v.label}</span>
                                            <span class="pick-type">{v.type}</span>
                                        </button>
                                    </template>
                                </div>
                            </template>
                            <template lwc:if={hasPickerDataSources}>
                                <h3>Data sources</h3>
                                <div class="pick-list short">
                                    <template for:each={pickerDataSources} for:item="d">
                                        <div key={d.key} class="pick ds-pick">
                                            <span class="pick-label">{d.label} <span class="pick-type">{d.detail}</span></span>
                                            <button type="button" class="link-btn" data-rel={d.rel} data-object={d.object} data-label={d.openLabel} onclick={handleDrill}>Fields</button>
                                            <button type="button" class="link-btn" data-source={d.rel} onclick={handlePickList}>Add as table</button>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            <template lwc:if={hasLookups}>
                                <h3>Related records</h3>
                                <div class="pick-list short">
                                    <template for:each={pickerLookups} for:item="l">
                                        <button key={l.key} type="button" class="pick" data-rel={l.rel} data-object={l.object} data-label={l.label} onclick={handleDrill}>
                                            <span class="pick-label">{l.label}</span>
                                            <span class="pick-open">Open</span>
                                        </button>
                                    </template>
                                </div>
                            </template>
                            <template lwc:if={showListSection}>
                                <h3>Lists, added as tables</h3>
                                <template lwc:if={hasLists}>
                                    <div class="pick-list short">
                                        <template for:each={pickerLists} for:item="l">
                                            <button key={l.key} type="button" class="pick stacked" data-source={l.source} onclick={handlePickList}>
                                                <span class="pick-label">{l.label}</span>
                                                <span class="pick-type">{l.detail}</span>
                                            </button>
                                        </template>
                                    </div>
                                </template>
                                <lightning-input type="checkbox" class="slds-m-top_x-small" label="Show system lists (history, files, activities)" checked={showAllLists} onchange={handleShowAllLists}></lightning-input>
                            </template>
                        </template>
                    </aside>
                </div>
            </template>

            <!-- PREVIEW -->
            <template lwc:if={isPreview}>
                <div class="card db-bar">
                    <lightning-record-picker class="record-picker" label="Preview with this record" placeholder="Search records" object-api-name={tpl.baseObject} value={previewRecordId} onchange={handlePreviewRecord}></lightning-record-picker>
                    <template lwc:if={hasLanguages}>
                        <lightning-combobox label="Language" options={languageOptions} value={previewLanguage} onchange={handlePreviewLanguage}></lightning-combobox>
                    </template>
                    <button type="button" class="btn" onclick={refreshPreview}>Refresh</button>
                </div>
                <template lwc:if={previewError}>
                    <div class="health bad" role="alert">{previewError}</div>
                </template>
                <template lwc:if={showPreviewHint}>
                    <div class="card empty"><p>Pick a record to see exactly what would be generated for it. The preview uses your unsaved changes and saves nothing.</p></div>
                </template>
                <div class="db-stage">
                    <div class="db-dock static"><span class="dock-text">{pageLabel}. Page breaks and repeated headers appear in the PDF itself.</span></div>
                    <div class="page preview-page" style={pageStyle}>
                        <div class="preview-body" lwc:dom="manual"></div>
                    </div>
                </div>
            </template>

            <!-- TRANSLATE -->
            <template lwc:if={isTranslate}>
                <div class="card db-bar">
                    <template lwc:if={noTranslationLanguages}>
                        <p>Add extra languages under "Name and languages" in the Design view (for example "en, fr"), then come back here.</p>
                    </template>
                    <template lwc:else>
                        <lightning-combobox label="Translate into" placeholder="Choose a language" options={translationLanguages} value={transLanguage} onchange={handleTransLanguage}></lightning-combobox>
                        <button type="button" class="btn primary" onclick={handleSaveTranslations} disabled={noTransRows}>Save translations</button>
                    </template>
                </div>
                <template lwc:if={hasTransRows}>
                    <div class="card trans">
                        <p class="hint">Keep each field token exactly as it appears, including the double braces. You can move a token anywhere in the sentence. Anything left blank prints in the default language.</p>
                        <template for:each={transRows} for:item="p">
                            <div key={p.key} class="trans-row">
                                <div class="trans-source">
                                    <span class="eyebrow">{p.label}</span>
                                    <template lwc:if={p.outOfDate}><span class="rule-tag inline">Original changed since this was translated</span></template>
                                    <div class="trans-text">{p.source}</div>
                                </div>
                                <lightning-textarea class="trans-input" label="Translation" variant="label-hidden" value={p.translated} data-index={p.index} onchange={handleTransText}></lightning-textarea>
                            </div>
                        </template>
                    </div>
                </template>
            </template>
        </template>
    </div>
</template>
